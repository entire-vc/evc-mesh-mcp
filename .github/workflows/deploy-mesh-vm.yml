name: Deploy MCP server to mesh VM (via hel01)

# Delivery path for THIS repository's binary to the public MCP endpoint
# (https://mesh.entire.host/mcp). Background: Mesh task #3bc9f59d.
#
# ─── The cutover is DONE (2026-08-23, subtask #e85e4e05) ────────────────────
# evc-mesh/cmd/mcp — the second copy of this server — has been deleted, and
# with it every pipeline step that built and shipped it:
#   * evc-mesh/.github/workflows/deploy-backend.yml  (mesh-mcp steps removed)
#   * entire-vc/deploy/.gitlab-ci.yml, build/deploy/verify:mesh-backend
#     (the LIVE deploy path since the GitLab move — it was still building
#     mesh-mcp from evc-mesh's copy, which is what actually kept the race alive)
# On GitLab canon this workflow is therefore the only writer of
# /opt/evc-mesh/bin/mesh-mcp. NOT yet true of the GitHub mirror: it still
# carries the pre-#763 deploy-backend.yml and a cmd/mcp to build, and GitHub
# Actions run off the mirror. Hence the cross-repo guard below is still armed —
# see the removal condition written there.
#
# ─── Still no push trigger, and now for a DIFFERENT reason ──────────────────
# The old reason (two repositories fighting over one binary) is gone. The
# current one is fleet policy: since the GitLab move every product deploys
# from a manual job in entire-vc/deploy, with `allow_failure: false`, on a
# human's click. An auto-deploy here would make this the one product that
# ships itself, and it would ship on a MIRROR push (GitHub) rather than from
# the canonical repository (git.entire.host) — deploy triggered by a copy.
#
# So this stays dispatch-only. What that costs, named plainly: a merged fix
# does NOT reach prod until someone dispatches this workflow. If that gap
# starts biting, the fix is a `deploy:mesh-mcp` manual job in entire-vc/deploy
# next to the other products — not a push trigger on a mirror.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'dry-run (verify + print plan, changes nothing) | deploy | rollback'
        type: choice
        options: [dry-run, deploy, rollback]
        default: dry-run
      force:
        description: 'Skip the burst-deploy guard'
        type: boolean
        default: false

# Serialises this workflow against itself. It cannot serialise against
# evc-mesh's deploy-backend.yml — see the cross-repo guard step below, which is
# what covers that gap for as long as the GitHub mirror still carries a copy of
# that workflow able to build cmd/mcp.
concurrency:
  group: mesh-mcp-deploy-prod
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy to mesh-vm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      # ci.yml gates every merge, but a workflow_dispatch can name any ref,
      # including one whose CI never ran. Re-running the suite here keeps the
      # deploy fail-closed rather than trusting the ref's history.
      - name: Test (fail-closed gate)
        if: inputs.mode != 'rollback'
        run: go test ./... -race

      - name: Build (linux/amd64)
        if: inputs.mode != 'rollback'
        run: |
          GOOS=linux GOARCH=amd64 go build \
            -ldflags "-s -w -X github.com/entire-vc/evc-mesh-mcp/internal/mcp.BuildSHA=${{ github.sha }}" \
            -o mesh-mcp .
          sha256sum mesh-mcp | cut -d' ' -f1 > mesh-mcp.sha256
          echo "built $(cat mesh-mcp.sha256)"

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}

      # CI runners reach the mesh VM (private 10.10.10.10) only through the
      # hel01 forwarding-only jump user `ghdeploy`. This repository has its own
      # key (`ghdeploy-mesh-mcp@hel01-20260823`), not a copy of evc-mesh's:
      # revoking one must not break the other. On hel01 it is pinned to
      # permitopen="10.10.10.10:22"; on mesh-vm it carries `restrict`.
      - name: Configure hel01 jump
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          ssh-keyscan -H 66.151.34.194 >> ~/.ssh/known_hosts 2>/dev/null || true
          {
            echo "Host mesh-vm"
            echo "  HostName 10.10.10.10"
            echo "  User root"
            echo "  ProxyJump hel01-jump"
            echo "  StrictHostKeyChecking accept-new"
            echo "Host hel01-jump"
            echo "  HostName 66.151.34.194"
            echo "  User ghdeploy"
            echo "  StrictHostKeyChecking accept-new"
          } >> ~/.ssh/config
          chmod 600 ~/.ssh/config

      # Cross-repo guard: evc-mesh's deploy-backend.yml also writes
      # /opt/evc-mesh/bin/mesh-mcp, so its run and ours can collide on the same
      # binary. evc-mesh is a public repository, so its run list is readable
      # without a token. Fail-closed: an unreadable API answer holds the deploy
      # rather than assuming the coast is clear.
      #
      # ⚠️ THIS GUARD LOOKS DEAD AND IS NOT. Measured 2026-08-23 (#e85e4e05):
      #   * GitLab canon (origin/main)  — deploy-backend.yml: 0 live mesh-mcp
      #     lines. That half was removed by evc-mesh!763.
      #   * GitHub mirror (showcase/main) — the SAME file still carries 20 live
      #     mesh-mcp lines, AND cmd/mcp still exists on that branch, so the
      #     workflow would build and swap the stale duplicate successfully.
      #     It last did so on 2026-08-22T21:10Z.
      # GitHub Actions run off the MIRROR, not off canon, and the mirror has
      # been stuck since 2026-08-20 (Mesh #bdd682a4), with PRs still landing on
      # GitHub main directly (Mesh #3967b15a). So merging the deletion into
      # GitLab does NOT disarm this path — only the mirror catching up does.
      #
      # Remove this step when, and only when, `git show showcase/main:.github/
      # workflows/deploy-backend.yml | grep -E 'mesh-mcp|cmd/mcp' | grep -vc '^\s*#'`
      # returns 0. Removing it earlier restores the exact race this file exists
      # to prevent, and the failure is silent: the wrong binary just wins.
      - name: Refuse to race evc-mesh's backend deploy
        if: inputs.mode != 'dry-run'
        run: |
          RESP=$(curl -sf --max-time 20 \
            "https://api.github.com/repos/entire-vc/evc-mesh/actions/workflows/deploy-backend.yml/runs?status=in_progress&per_page=1") || {
              echo "::error::could not read evc-mesh's deploy runs — holding (fail-closed)"; exit 1; }
          COUNT=$(echo "$RESP" | python3 -c 'import sys,json; print(json.load(sys.stdin)["total_count"])') || {
              echo "::error::unparseable answer from the runs API — holding (fail-closed)"; exit 1; }
          if [ "$COUNT" != "0" ]; then
            echo "::error::evc-mesh deploy-backend.yml has $COUNT run(s) in flight — it deploys mesh-mcp too. Wait for it, then re-dispatch."
            exit 1
          fi
          echo "no evc-mesh backend deploy in flight"

      - name: Burst-deploy guard
        if: inputs.mode == 'deploy' && !inputs.force
        run: |
          LAST=$(ssh mesh-vm 'cat /opt/evc-mesh/.last-mesh-mcp-deploy 2>/dev/null || echo 0')
          DIFF=$(( $(date +%s) - LAST ))
          if [ "$DIFF" -lt 300 ]; then
            echo "::error::Burst-deploy guard: last mesh-mcp deploy was ${DIFF}s ago (< 5 min). Re-dispatch with force=true to override."
            exit 1
          fi

      # Re-uploaded every run so the code executing on prod is the code in this
      # commit — a host-side copy cannot drift from the reviewed one.
      - name: Upload remote deploy script
        run: |
          rsync -avz --checksum scripts/mesh-mcp-remote-deploy.sh mesh-vm:/opt/evc-mesh/bin/mesh-mcp-remote-deploy.sh
          ssh mesh-vm 'chmod +x /opt/evc-mesh/bin/mesh-mcp-remote-deploy.sh'

      - name: Upload binary
        if: inputs.mode != 'rollback'
        run: |
          rsync -avz --checksum mesh-mcp mesh-vm:/opt/evc-mesh/bin/mesh-mcp.new
          rsync -avz mesh-mcp.sha256 mesh-vm:/opt/evc-mesh/bin/mesh-mcp.new.sha256

      - name: Run ${{ inputs.mode }}
        env:
          MODE: ${{ inputs.mode }}
          SHA: ${{ github.sha }}
        run: |
          ssh mesh-vm "EXPECTED_SHA=$SHA /opt/evc-mesh/bin/mesh-mcp-remote-deploy.sh $MODE"

      - name: Status after
        if: always()
        run: ssh mesh-vm '/opt/evc-mesh/bin/mesh-mcp-remote-deploy.sh status' || true

      # Written only after the swap, restart and smoke all came back clean —
      # this is what the burst guard reads, so it must mean "a verified deploy
      # happened", not "an upload finished".
      - name: Record deploy timestamp
        if: inputs.mode == 'deploy'
        run: ssh mesh-vm 'date +%s > /opt/evc-mesh/.last-mesh-mcp-deploy'
