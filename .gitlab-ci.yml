# CI for the GitLab canon (git.entire.host/entire-vc/evc-mesh-mcp).
#
# Same rollout as entire-vc/evc-mesh — this repo had ZERO
# .gitlab-ci.yml and zero pipelines since the GitLab move, even though
# the binary built from it is what every agent actually runs.
#
# Ported from .github/workflows/ci.yml, not copied from evc-mesh: this repo
# has no lint step on GitHub (no golangci-lint config in the repo — go vet +
# go test is the whole check), no DB/services (no migrations package here),
# and carries a repo-specific job GitHub also runs: the deploy-drill, which
# exercises scripts/mesh-mcp-remote-deploy.sh's rollback-anchor ordering
# against a stubbed systemctl/HTTP, with its own negative control (a
# deliberately-mutated copy of the script that must fail the drill).
#
# `only_allow_merge_if_pipeline_succeeds` is out of scope here too —
# it needs Maintainer.

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH

stages: [gate, test, build]

variables:
  GOFLAGS: "-buildvcs=false"

default:
  tags: [docker]
  interruptible: true

# ── gate ────────────────────────────────────────────────────────────────────
hold-gate:
  stage: gate
  image: alpine:latest
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  script:
    - |
      set -eu
      LABELS_FILE=.github/hold-labels.txt
      test -f "$LABELS_FILE" || { echo "REFUSING: $LABELS_FILE missing — cannot know what 'held' means"; exit 1; }
      HOLD=$(grep -vE '^\s*(#|$)' "$LABELS_FILE" | tr 'A-Z' 'a-z' | tr -d '\r' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//' | grep -c . || true)
      test "$HOLD" -gt 0 || { echo "REFUSING: $LABELS_FILE parsed to zero labels — a gate that knows no hold label passes everything"; exit 1; }
      echo "hold labels known: $HOLD"
      echo "labels on this merge request: '${CI_MERGE_REQUEST_LABELS:-}'"
      FOUND=""
      OLDIFS=$IFS; IFS=','
      for L in ${CI_MERGE_REQUEST_LABELS:-}; do
        L=$(printf '%s' "$L" | tr 'A-Z' 'a-z' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')
        [ -n "$L" ] || continue
        if grep -vE '^\s*(#|$)' "$LABELS_FILE" | tr 'A-Z' 'a-z' | tr -d '\r' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//' | grep -qxF "$L"; then
          FOUND="$FOUND $L"
        fi
      done
      IFS=$OLDIFS
      if [ -n "$FOUND" ]; then
        echo "REFUSING to let this merge request through: it carries a hold label —$FOUND"
        echo "Remove the label when the work is ready; this job re-runs on the next pipeline."
        exit 1
      fi
      echo "no hold label present ✓"

# ── test ────────────────────────────────────────────────────────────────────
test:
  stage: test
  image: golang:1.25-alpine
  timeout: 15m
  cache:
    key: go-mod-$CI_COMMIT_REF_SLUG
    paths: [.gocache/, .gomodcache/]
  variables:
    GOCACHE: $CI_PROJECT_DIR/.gocache
    GOMODCACHE: $CI_PROJECT_DIR/.gomodcache
  before_script:
    # build-base for cgo — `go test -race` needs a C toolchain, alpine has none
    # by default (same gotcha as evc-mesh's lint/test jobs).
    - apk add --no-cache git build-base bash
  script:
    - go vet ./...
    - go test ./... -race

# ── build ───────────────────────────────────────────────────────────────────
build:
  stage: build
  image: golang:1.25-alpine
  timeout: 10m
  cache:
    key: go-mod-$CI_COMMIT_REF_SLUG
    paths: [.gocache/, .gomodcache/]
    policy: pull
  variables:
    GOCACHE: $CI_PROJECT_DIR/.gocache
    GOMODCACHE: $CI_PROJECT_DIR/.gomodcache
  before_script:
    - apk add --no-cache git build-base
  script:
    - go build -o /tmp/evc-mesh-mcp .

deploy-drill:
  stage: build
  image: golang:1.25-alpine
  timeout: 10m
  before_script:
    - apk add --no-cache bash
  script:
    - bash scripts/mesh-mcp-deploy-drill.sh scripts/mesh-mcp-remote-deploy.sh
    # Negative control — the drill must fail on a broken script, or it proves
    # nothing (a check that cannot go red is worse than no check).
    - |
      sed 's/\[ "\$seq" -ge "\$n" \]/[ "$seq" -eq "$n" ]/' \
        scripts/mesh-mcp-remote-deploy.sh > /tmp/mutant.sh
      if bash scripts/mesh-mcp-deploy-drill.sh /tmp/mutant.sh > /tmp/mutant.log 2>&1; then
        echo "the drill passed a script with the anchor-ordering rule reverted — it is not asserting anything"
        cat /tmp/mutant.log
        exit 1
      fi
      echo "negative control OK — the drill goes red on the reverted ordering rule:"
      grep FAIL /tmp/mutant.log

# ── topology-gate ───────────────────────────────────────────────────────────
# Public repositories must not describe private infrastructure: a deploy runbook
# once shipped here with the production gateway address, its subnet and a map of
# every VM, and nothing in CI looked at that class of text. This job scans the
# whole tracked tree (not just the diff) for non-documentation IPv4 addresses,
# private subnets, internal host/user names (hashed dictionary in
# .topology-gate/names.sha256) and references to the private ops tree.
#
# Fail-closed on purpose: allow_failure is false, a missing or malformed
# dictionary is an error (exit 2), and the only way to make an exception is a
# line with a written reason in .topology-gate/allowlist.txt — there is no skip
# flag. The unit tests run first so a gate that stopped detecting anything goes
# red instead of quietly green.
topology-gate:
  stage: gate
  image: python:3.12-alpine
  allow_failure: false
  before_script:
    - apk add --no-cache git
    - git config --global --add safe.directory "$CI_PROJECT_DIR"
  script:
    - python3 scripts/test_topology_gate.py
    - python3 scripts/topology_gate.py

# ── commit-author-gate ───────────────────────────────────────────────────────
# A lane's ambient GIT_AUTHOR_*/GIT_COMMITTER_* overrides its worktree `user.*`
# config, so a commit can land under a foreign identity (Robert Johansson, the
# `unconfigured` placeholder) with nothing noticing until someone reads the log.
# Refuses any commit in `origin/<target>..HEAD` whose author or committer
# e-mail is not in `.gitlab/commit-author-allowlist.txt`; exceptions are
# explicit lines there. MR pipelines only by design: a push pipeline has no
# target branch to diff against. See `.gitlab/scripts/commit_author_gate.py`.
commit-author-gate:
  stage: gate
  image: python:3.12-alpine
  allow_failure: false
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  variables:
    GIT_DEPTH: "0"
  before_script:
    - apk add --no-cache git
    - git fetch origin "+refs/heads/$CI_MERGE_REQUEST_TARGET_BRANCH_NAME:refs/remotes/origin/$CI_MERGE_REQUEST_TARGET_BRANCH_NAME"
  script:
    - python3 .gitlab/scripts/commit_author_gate.py
